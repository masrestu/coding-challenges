<!DOCTYPE html>
<html lang="en" class="accent-green-200">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Password generator app</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="font-display px-200 grid place-items-center min-h-svh bg-linear-(--body-gradient) text-grey-200 font-bold py-200 relative">
    <div id="password_generator_app" class="container grid gap-y-200 max-w-[33.75rem] transition-all duration-150 md:gap-y-400 peer">
        <header>
            <h1 class="text-center text-grey-600 transition-all duration-150 md:text-2xl">Password Generator</h1>
        </header>
        <main>
            <div class="container grid gap-y-200 transition-all duration-150 md:gap-y-400">
                <div class="flex justify-between items-center bg-grey-800 h-16 md:h-20 px-200 relative transition-all duration-150 md:px-400">
                    <input type="text" placeholder="P4$5w0Rd!" class="outline-none placeholder:text-grey-700 text-2xl w-full cursor-default transition-all duration-150 md:text-3xl" id="generated_pwd" tabindex="0" readonly>
                    <div class="copy-btn-group flex flex-row-reverse justify-end items-center text-green-200 gap-100 h-full bg-linear-(--copy-btn-gradient) absolute right-200 group/copy transition-all duration-150 md:right-400">
                        <svg tabindex="0" width="24" height="24" xmlns="http://www.w3.org/2000/svg" id="btn_copy" class="peer cursor-pointer group/copybtn">
                            <path class="fill-green-200 group-hover/copybtn:fill-white transition-colors duration-150" d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z" />
                        </svg>
                        <span class="uppercase cursor-default ps-4 w-0 overflow-hidden group-[.copied]/copy:w-28 group-[.copied]/copy:ps-12 ease-in md:text-lg/snug transition-all duration-150">copied</span>
                    </div>
                </div>

                <div class="grid gap-y-400 bg-grey-800 p-200 md:px-400 transition-all duration-150 md:py-6">
                    <form class="grid gap-y-2 md:gap-y-4 transition-all duration-150" oninput="char_length_value.value = char_length.value">
                        <div class="flex justify-between items-center h-400 md:h-550 transition-all duration-150">
                            <label for="char_length" class="md:text-lg transition-all duration-150">Character Length</label>
                            <output class="text-green-200 text-2xl transition-all duration-150 md:text-3xl" name="char_length_value" id="char_length_value"></output>
                        </div>
                        <input type="range" name="char_length" id="char_length" value="0" min="0" max="20" class="cursor-pointer appearance-none h-7 focus:outline-hidden transition-colors duration-150" step="1" tabindex="0" />
                    </form>

                    <ul class="grid gap-y-200" id="character_type">
                        <li>
                            <label tabindex="0" class="cursor-pointer flex items-center gap-200 group text-base/tight md:text-lg/snug transition-all duration-150">
                                <input type="checkbox" name="contains" id="inc_upper" class="peer hidden" />
                                <span class="border-grey-200 group flex size-5 items-center justify-center border-2 peer-checked:border-green-200 peer-checked:bg-green-200 group-hover:border-green-200">
                                    <svg width="14" height="12" xmlns="http://www.w3.org/2000/svg" class="hidden">
                                        <path stroke="#18171F" fill="none" stroke-width="3" d="M1 5.607 4.393 9l8-8" />
                                    </svg>
                                </sp>
                                <span>Include Uppercase Letters</span>
                            </label>
                        </li>
                        <li>
                            <label tabindex="0" class="cursor-pointer flex items-center gap-200 group text-base/tight md:text-lg transition-all duration-150">
                                <input type="checkbox" name="contains" id="inc_lower" class="peer hidden" />
                                <span class="border-grey-200 group flex size-5 items-center justify-center border-2 peer-checked:border-green-200 peer-checked:bg-green-200 group-hover:border-green-200">
                                    <svg width="14" height="12" xmlns="http://www.w3.org/2000/svg" class="hidden">
                                        <path stroke="#18171F" fill="none" stroke-width="3" d="M1 5.607 4.393 9l8-8" />
                                    </svg>
                                </sp>
                                <span>Include Lowercase Letters</span>
                            </label>
                        </li>
                        <li>
                            <label tabindex="0" class="cursor-pointer flex items-center gap-200 group text-base/tight md:text-lg transition-all duration-150">
                                <input type="checkbox" name="contains" id="inc_numbers" class="peer hidden" />
                                <span class="border-grey-200 group flex size-5 items-center justify-center border-2 peer-checked:border-green-200 peer-checked:bg-green-200 group-hover:border-green-200">
                                    <svg width="14" height="12" xmlns="http://www.w3.org/2000/svg" class="hidden">
                                        <path stroke="#18171F" fill="none" stroke-width="3" d="M1 5.607 4.393 9l8-8" />
                                    </svg>
                                </sp>
                                <span>Include Numbers</span>
                            </label>
                        </li>
                        <li>
                            <label tabindex="0" class="cursor-pointer flex items-center gap-200 group text-base/tight md:text-lg transition-all duration-150">
                                <input type="checkbox" name="contains" id="inc_symbols" class="peer hidden" />
                                <span class="border-grey-200 group flex size-5 items-center justify-center border-2 peer-checked:border-green-200 peer-checked:bg-green-200 group-hover:border-green-200">
                                    <svg width="14" height="12" xmlns="http://www.w3.org/2000/svg" class="hidden">
                                        <path stroke="#18171F" fill="none" stroke-width="3" d="M1 5.607 4.393 9l8-8" />
                                    </svg>
                                </sp>
                                <span>Include Symbols</span>
                            </label>
                        </li>
                    </ul>

                    <div class="grid gap-y-200 md:gap-y-8 transition-all duration-150">
                        <div class="uppercase flex items-center justify-between bg-grey-850 px-200 py-3.5 md:px-8 h-14 md:h-900 transition-all duration-150">
                            <span class="text-gray-600 md:text-lg transition-all duration-150">Strength</span>
                            <div class="flex gap-2 group items-center text-gray-200">
                                <span id="strength_indicator" class="uppercase pe-100 md:text-2xl transition-all duration-150" data-value="0">MEDIUM</span>
                                <div class="transition-colors duration-150 border-2 border-(--indicator-stroke-1) h-350 w-2.5 bg-(--indicator-fill-1)"></div>
                                <div class="transition-colors duration-150 border-2 border-(--indicator-stroke-2) h-350 w-2.5 bg-(--indicator-fill-2)"></div>
                                <div class="transition-colors duration-150 border-2 border-(--indicator-stroke-3) h-350 w-2.5 bg-(--indicator-fill-3)"></div>
                                <div class="transition-colors duration-150 border-2 border-(--indicator-stroke-4) h-350 w-2.5 bg-(--indicator-fill-4)"></div>
                            </div>
                        </div>
                        <button type="button" id="btn_generate" class="uppercase flex items-center justify-center gap-200 bg-green-200 text-grey-800 h-700 cursor-pointer group hover:bg-transparent hover:border-2 hover:border-green-200 hover:text-green-200 disabled:bg-grey-600 disabled:text-grey-200 disabled:border-grey-200 md:h-800 transition-all duration-150" tabindex="0">
                            <span id="btn_generate_title" class="md:text-lg/snug transition-all duration-150 text-base/tight">Generate</span>

                            <svg width="12" height="12" xmlns="http://www.w3.org/2000/svg" class="group-disabled:hidden">
                                <path class="fill-grey-800 group-hover:fill-green-200" fill="inherit" d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <aside id="error_message" class="container max-w-[33.75rem] mx-auto bg-red-500 p-200 fixed top-4 -translate-y-40 peer-[.invalid]:translate-y-0 transition-all duration-150">
        Select at least one character type
    </aside>
</body>

</html>
